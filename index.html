<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="116 會考 AI 學習系統錯題資料庫" />
  <title>116 會考 AI 學習系統</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <div><p class="eyebrow">116 會考 AI 學習系統</p><h1>錯題資料庫</h1><p>從整張考卷一次框出多題，再批次建立錯題。</p></div>
    <button id="addBtn" class="primary">＋ 新增錯題</button>
  </header>

  <main>
    <section class="scan-card card">
      <div class="section-head">
        <div><p class="eyebrow dark">v0.4 多框標註</p><h2>📷 上傳已批改的考卷</h2><p>可在同一張考卷上畫多個自由大小的框，每個框都能移動、縮放與刪除，最後逐題加入資料庫。</p></div>
        <label class="upload-btn primary">選擇照片<input id="paperInput" type="file" accept="image/*" capture="environment" hidden /></label>
      </div>

      <div id="scanWorkspace" class="scan-workspace hidden">
        <div class="scan-toolbar">
          <strong id="paperName"></strong>
          <div class="scan-actions">
            <button id="drawModeBtn" type="button" class="primary">＋ 畫新框</button>
            <button id="selectModeBtn" type="button">↖ 選取調整</button>
            <button id="deleteBoxBtn" type="button">刪除選取框</button>
            <button id="clearBoxesBtn" type="button">清除全部</button>
          </div>
        </div>
        <p class="hint">「畫新框」：在題目左上拖到右下；「選取調整」：點框後可拖曳移動，拉控制點改大小。</p>
        <div id="annotationViewport" class="annotation-viewport"><div id="annotationStage"></div></div>
        <h3 class="result-title">已框選錯題</h3>
        <div id="detectedList" class="detected-list"></div>
      </div>
    </section>

    <section class="toolbar card"><input id="searchInput" type="search" placeholder="搜尋題目、觀念、知識點…" /><select id="subjectFilter"><option value="all">全部科目</option></select><select id="statusFilter"><option value="all">全部狀態</option><option value="待複習">待複習</option><option value="複習中">複習中</option><option value="已掌握">已掌握</option></select><button id="randomBtn">隨機重做一題</button></section>
    <section id="stats" class="stats"></section><section id="questionList" class="question-list"></section>
  </main>

  <dialog id="questionDialog"><form id="questionForm" method="dialog"><div class="dialog-head"><h2 id="dialogTitle">新增錯題</h2><button type="button" id="closeBtn" class="icon-btn" aria-label="關閉">×</button></div><input type="hidden" id="questionId" /><div class="grid two"><label>科目<input id="subject" required placeholder="例如：自然" /></label><label>章節<input id="chapter" placeholder="例如：刺激與反應" /></label><label>題號<input id="number" placeholder="例如：23" /></label><label>狀態<select id="status"><option>待複習</option><option>複習中</option><option>已掌握</option></select></label></div><label>1. 題目<textarea id="question" required rows="4"></textarea></label><div class="grid two"><label>2. 正確答案<input id="correctAnswer" required /></label><label>我的答案<input id="myAnswer" /></label></div><label>3. 我的錯誤<textarea id="mistake" rows="3"></textarea></label><label>4. 解題觀念<textarea id="concept" rows="3"></textarea></label><label>5. 知識點<textarea id="knowledge" rows="3"></textarea></label><label>詳細解答<textarea id="explanation" rows="7"></textarea></label><label>錯誤類型<input id="tags" placeholder="觀念混淆, 範圍判斷" /></label><div class="actions"><button type="button" id="deleteBtn" class="danger hidden">刪除</button><button type="submit" class="primary">儲存錯題</button></div></form></dialog>

  <script src="https://cdn.jsdelivr.net/npm/konva@9/konva.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="app.js"></script>
  <script src="scan.js"></script>
</body>
</html>
