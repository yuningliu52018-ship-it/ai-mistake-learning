<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="116 會考 AI 學習系統錯題資料庫" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="AI錯題" />
  <title>116 會考 AI 學習系統</title>
  <link rel="manifest" href="manifest.webmanifest?v=3.4" />
  <link rel="icon" href="app-icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="app-icon.svg" />
  <link rel="stylesheet" href="styles.css?v=3.4" />
</head>
<body>
  <header class="hero">
    <div><p class="eyebrow">116 會考 AI 學習系統</p><h1>錯題資料庫</h1><p>手機連續拍考卷、AI 找錯題並智慧裁切必要題圖；桌機閱讀、整理、類題與複習。</p></div>
    <button id="addBtn" class="primary">＋ 新增錯題</button>
  </header>

  <main>
    <section class="scan-card card">
      <div class="section-head">
        <div><p class="eyebrow dark">v3.4 Smart Crop</p><h2>📷 批次拍攝已批改考卷</h2><p>Gemini 逐頁找錯題；純文字題不保存圖片，需要圖形、圖表、表格或閱讀材料時，只裁切並保存解題必要區域。</p></div>
        <label class="upload-btn primary">📷 拍／加入下一張<input id="paperInput" type="file" accept="image/*" capture="environment" hidden /></label>
      </div>

      <section id="autoDetectPanel" class="auto-detect-panel">
        <div class="auto-detect-head"><div><strong>批次考卷模式</strong><div class="hint">先連續拍完所有頁面，再按「AI 批次找錯題」。Gemini 會逐頁分析，並為需要圖片的題目標出 Smart Crop 裁切範圍。</div></div><button id="autoDetectBtn" type="button" class="primary" disabled>🤖 AI 批次找錯題</button></div>
        <div id="autoDetectResults"></div>
        <button id="manualFallbackBtn" type="button">＋ AI 漏題？手動補一題</button>
      </section>

      <div id="scanWorkspace" class="scan-workspace hidden">
        <div class="scan-toolbar">
          <strong id="paperName"></strong>
          <div class="scan-actions">
            <button id="drawModeBtn" type="button" class="primary">＋ 手動畫框</button>
            <button id="selectModeBtn" type="button">↖ 選取調整</button>
            <button id="deleteBoxBtn" type="button">刪除選取框</button>
            <button id="clearBoxesBtn" type="button">清除全部</button>
          </div>
        </div>
        <p class="hint">只有 AI 漏題時才使用：框選完整題目後按「🤖 Gemini 智慧分析」。</p>
        <div id="annotationViewport" class="annotation-viewport"><div id="annotationStage"></div></div>
        <h3 class="result-title">手動補題</h3>
        <div id="detectedList" class="detected-list"></div>
      </div>
    </section>

    <section class="study-only toolbar card"><input id="searchInput" type="search" placeholder="搜尋題目、觀念、知識點、題型…" /><select id="subjectFilter"><option value="all">全部科目</option></select><select id="statusFilter"><option value="all">全部狀態</option><option value="待複習">待複習</option><option value="複習中">複習中</option><option value="已掌握">已掌握</option></select><button id="randomBtn">隨機重做一題</button></section>
    <section id="stats" class="study-only stats"></section><section id="questionList" class="study-only question-list"></section>
  </main>

  <dialog id="questionDialog"><form id="questionForm" method="dialog"><div class="dialog-head"><h2 id="dialogTitle">新增錯題</h2><button type="button" id="closeBtn" class="icon-btn" aria-label="關閉">×</button></div><input type="hidden" id="questionId" />
    <div class="grid two">
      <label>科目<input id="subject" required placeholder="例如：自然" /></label><label>章節<input id="chapter" placeholder="例如：刺激與反應" /></label><label>題號<input id="number" placeholder="例如：23" /></label><label>狀態<select id="status"><option>待複習</option><option>複習中</option><option>已掌握</option></select></label><label>題型<input id="questionType" placeholder="例如：圖表判讀" /></label><label>難度<select id="difficulty"><option value="1">★☆☆☆☆</option><option value="2">★★☆☆☆</option><option value="3" selected>★★★☆☆</option><option value="4">★★★★☆</option><option value="5">★★★★★</option></select></label>
    </div>
    <label>1. 題目<textarea id="question" required rows="4"></textarea></label><div class="grid two"><label>2. 正確答案<input id="correctAnswer" required /></label><label>我的答案<input id="myAnswer" /></label></div><label>3. 我的錯誤<textarea id="mistake" rows="3"></textarea></label><label>4. 解題觀念<textarea id="concept" rows="3"></textarea></label><label>5. 知識點／考點<textarea id="knowledge" rows="3"></textarea></label><label>詳細解答<textarea id="explanation" rows="7"></textarea></label><label>錯誤類型與 AI 標籤<input id="tags" placeholder="觀念混淆, 親屬稱謂" /></label><div class="actions"><button type="button" id="deleteBtn" class="danger hidden">刪除</button><button type="submit" class="primary">儲存錯題</button></div>
  </form></dialog>

  <script src="https://cdn.jsdelivr.net/npm/konva@9/konva.min.js"></script>
  <script src="config.js?v=3.4"></script>
  <script src="app.js?v=3.4"></script>
  <script src="ui-v3.2.js?v=3.4"></script>
  <script src="scan.js?v=3.4"></script>
  <script src="no-ocr-mode.js?v=3.4"></script>
  <script src="vision-ai.js?v=3.4"></script>
  <script src="mobile-mode.js?v=3.4"></script>
  <script src="auto-detect.js?v=3.4"></script>
  <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js?v=3.4').catch(console.error));}</script>
</body>
</html>
