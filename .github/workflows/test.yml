name: Regression tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in *.js worker/src/*.js; do node --check "$file"; done
      - name: Test cleanup and bilingual comics
        run: node --test tests/*.test.cjs
