<body><h1>日英有聲漫畫・窄螢幕檢查</h1><p>開發用版面檢查：嵌入同一個正式頁面，檢查 320 與 390 CSS 像素寬度。使用正式 Google 語音，不模擬播放。<br><a href="../japanese-comics.html">回漫畫圖庫</a></p>
<div class="previews"><section><h2>320 px · 小螢幕</h2><iframe id="left" width="320" title="320 像素英文有聲漫畫預覽"></iframe></section><section><h2>390 px · 手機</h2><iframe id="right" width="390" title="390 像素英文有聲漫畫預覽"></iframe></section></div>
<script>
const query=new URLSearchParams(location.search);
for(const side of ['left','right']){const candidate=query.get(side)||'l1-01-polite-request';const id=/^[a-z0-9-]+$/.test(candidate)?candidate:'l1-01-polite-request';document.getElementById(side).src='../voiced-comic.html?comic='+encodeURIComponent(id)+'&lang=en';}
</script>
